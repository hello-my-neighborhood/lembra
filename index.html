<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html, body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:pan-y;overscroll-behavior-y:none}

.s7 .r7{position:absolute;left:16px;right:16px;height:34px;display:flex;align-items:center;font-size:14px;border-top:1px solid var(--bd)}

@keyframes tgcol{0%,24%{opacity:1;scale:1}34%,70%{opacity:0;scale:.96}82%,100%{opacity:1;scale:1}}

@keyframes tgtap2{0%,16%{opacity:0;scale:1.3}20%{opacity:1;scale:1}26%{scale:.8}30%{scale:1}38%,64%{opacity:0}68%{opacity:0;scale:1.3}72%{opacity:1;scale:1}78%{scale:.8}82%{scale:1}90%,100%{opacity:0}}

/* ============ busca (puxar de cima) — um desenho para cada visual ============ */
.fnd{transition:background .3s ease}
#fnd{align-items:flex-start!important;padding:calc(10px + env(safe-area-inset-top)) 12px 12px!important}
#fnd.open{background:rgba(0,0,0,.34)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#fnd.closing{background:rgba(0,0,0,0)!important}
#fnd .fp{background:var(--bg);border:1px solid var(--bd);border-radius:26px;box-shadow:0 18px 48px rgba(0,0,0,.2);min-height:0;max-height:calc(100dvh - 24px - env(safe-area-inset-top) - var(--kb,0px));transform-origin:50% 0;-webkit-backdrop-filter:none;backdrop-filter:none}
#fnd .fh{padding:12px 14px 10px;gap:10px;border-bottom:1px solid var(--bd)}
.fsi{display:flex;width:34px;height:34px;border-radius:11px;background:var(--ac2);color:var(--ac);align-items:center;justify-content:center;flex:none}
#fnd .fh input[type=text]{font-size:18px;padding:6px 0}
#fnd #fres{padding:8px 10px 6px;max-height:calc(100dvh - 128px - env(safe-area-inset-top) - var(--kb,0px))}
#fnd .fr{border-radius:14px;padding:9px 10px;gap:12px;border:1.5px solid transparent}
#fnd .fr .fi{width:34px!important;height:34px;border-radius:11px;background:var(--bg2,rgba(120,125,140,.14));color:var(--mu);display:flex;align-items:center;justify-content:center;flex:none}
#fnd .fr.sel, #fnd .fr:hover{background:transparent;border-color:var(--ac)}
#fnd .fr.sel .fi{background:var(--ac);color:var(--onac,#fff)}
#fnd .fr em{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
.fhint{padding:8px 12px 10px;font-size:12px;color:var(--mu);line-height:1.5}
.fhint b{color:var(--tx)}
/* indicador de puxar */
#pull{align-items:flex-end}
#pull .pl{display:flex;align-items:center;gap:8px;margin-bottom:4px;opacity:var(--pp,0);translate:0 calc((1 - var(--pp,0))*10px);scale:calc(.7 + .3*var(--pp,0))}
#pull .pl-ic{width:30px;height:30px;border-radius:10px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--bg);transition:background .2s,color .2s,scale .3s ease}
#pull.arm .pl-ic{background:var(--ac);color:var(--onac,#fff);border-color:var(--ac);scale:1.1}
#pull .pl-tx{font-size:13px;color:var(--mu)}
#pull.arm .pl-tx{color:var(--ac);font-weight:600}
/* Liquid glass */
body.lg #fnd.open{-webkit-backdrop-filter:blur(8px)!important;backdrop-filter:blur(8px)!important;background:rgba(0,0,0,.22)!important}
body.lg #fnd .fp{background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(28px) saturate(2);backdrop-filter:blur(28px) saturate(2);box-shadow:0 20px 50px rgba(0,0,0,.22),inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 28px rgba(255,255,255,.1)}
body.lg #fnd .fh{border-bottom-color:rgba(255,255,255,.28)}
body.lg .fsi{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
body.lg #fnd .fr.sel, body.lg #fnd .fr:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(3px) brightness(1.1);backdrop-filter:blur(3px) brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(0,0,0,.08)}
body.lg #fnd .fr .fi{background:rgba(255,255,255,.2)}
body.lg #pull .pl-ic{background:var(--glass);border-color:var(--glassb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
body.lg #pull.arm .pl-ic{background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 78%,#fff),color-mix(in srgb,var(--ac) 92%,#000))}
/* CRT: prompt de terminal */
body.crt #fnd.open{background:rgba(0,0,0,.62)!important}
body.crt #fnd .fp{border:1px solid var(--ac);border-radius:12px;box-shadow:0 0 24px color-mix(in srgb,var(--ac) 30%,transparent),inset 0 0 14px color-mix(in srgb,var(--ac) 14%,transparent)}
body.crt .fsi{display:none}
body.crt #fnd .fh::before{content:">";color:var(--ac);font-weight:700;font-size:20px;line-height:1}
body.crt #fnd .fh input[type=text]{caret-color:var(--ac)}
body.crt #fnd .fr{border-radius:6px}
body.crt #fnd .fr .fi{border-radius:4px}
body.crt #fnd .fr.sel::before{content:"▸";color:var(--ac);margin-right:-4px}
body.crt #fnd .fr.sel, body.crt #fnd .fr:hover{background:var(--ac2)}
body.crt #pull .pl-ic{border-radius:6px;border-color:var(--ac);color:var(--ac)}
body.crt #pull .pl-tx::before{content:"> ";color:var(--ac)}
body.crt #pull .pl-tx::after{content:"_";color:var(--ac);animation:crtflick 1s steps(1) infinite}
/* Nostromo: colchetes e quinas retas */
body.nst #fnd .fp{border-radius:0;background-color:var(--bg);background-image:var(--brk-img);background-position:var(--brk-pos);background-size:var(--brk-size);background-repeat:no-repeat;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
body.nst #fnd .fh::before{content:"[ busca ]";color:var(--mu);font-size:12px;white-space:nowrap}
body.nst #fnd .fr, body.nst #fnd .fr .fi, body.nst #fnd .fr em{border-radius:0}
body.nst #fnd .fr .fi{border-radius:2px}
body.nst #fnd .fr.sel, body.nst #fnd .fr:hover{background-image:var(--brk-img);background-position:var(--brk-pos);background-size:var(--brk-size);background-repeat:no-repeat;border-color:transparent;background-color:var(--ac2)}
body.nst #fnd .fr.sel::before{content:none}
body.nst #pull .pl-ic{border-radius:0}
body.nst #pull .pl-tx::before{content:"[ "}
body.nst #pull .pl-tx::after{content:" ]";animation:none}
#fnd .fh input[type=text]{border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important}
/* ============ Jornada (visualização gamificada) ============ */
.jor h1{display:flex;align-items:center;gap:10px}
.jor h1 svg{color:var(--ac)}
.j-hero{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:22px;background:var(--card);margin:6px 0 12px}
.j-lv{width:52px;height:52px;border-radius:18px;background:var(--ac);color:var(--onac,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.j-lv b{font-size:22px}
.j-lv small{font-size:9px;opacity:.85;margin-top:2px}

.jc{position:relative;aspect-ratio:.82;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);font:inherit;padding:5px 5px 4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;overflow:hidden}

.jc.lv2{background:color-mix(in srgb,var(--ac) 16%,transparent)}

.jc.lv4{background:color-mix(in srgb,var(--ac) 38%,transparent)}

.j-lg{font-size:12px;color:var(--mu);line-height:1.5;margin:8px 0 0}
.j-yc{border:1px solid var(--bd);border-radius:20px;padding:12px 12px 10px;margin-bottom:10px;background:var(--card);overflow:hidden}
.j-yh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.j-yi{display:flex}
.j-yh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.j-ys{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}

.j-ml{position:relative;height:14px;font-size:9px;color:var(--mu)}

.j-hm{display:flex;gap:3px}
.j-col{display:flex;flex-direction:column;gap:3px}

.wk{position:relative;display:flex;gap:0;align-items:flex-start;margin-top:4px}
.wg{width:30px;flex:none;position:relative}
.wh2{position:relative;width:30px;margin-top:0}

.wc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}

.wnow::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--dg,#E0584B)}
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dsd{border:0;background:none;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px;border-radius:16px;cursor:pointer}

body.nst .jc, body.nst .j-hero, body.nst .j-seg, body.nst .j-seg button, body.nst .j-bd, body.nst .j-bd span, body.nst .j-yc, body.nst .j-lv, body.nst .j-mh button, body.nst .wn, body.nst .tlp{border-radius:0}

/* botão +: sem rolagem/seleção no toque, e anel em elemento próprio */

/* barra de navegação */

.wrow.ws{display:flex;align-items:center}.wrow.ws .wsl{flex:1}.wrow.ws .wt{margin-left:auto;font-style:normal;color:var(--mu);font-variant-numeric:tabular-nums}

body.sb-open #sheet .bk{z-index:60}body.sb-open #toast{z-index:70}

.j-ddn{margin:-6px 0 14px;font-size:12px;line-height:1.4;color:var(--mu)}

/* leque: nomes legíveis */
.fnb-nm{top:calc(100% + 5px);font-size:12px;font-weight:700;letter-spacing:.01em;background:rgba(0,0,0,.6);color:#fff;text-shadow:none;padding:2px 8px;border-radius:99px}

.row.late .ck:not(.on){border-color:var(--dg)}

.dtp-c{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));translate:-50% 0;width:min(380px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:14px 14px 12px;box-shadow:0 10px 36px rgba(0,0,0,.20)}
.dtp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.dtp-h b{font-size:16px}

async function fcNotify(r){const ln=LN();if(!ln)return;try{await ln.cancel({notifications:[{id:880001}]});if(r&&r.running)await ln.schedule({notifications:[{id:880001,title:'Lembra · Foco',body:r.phase==='focus'?'Pomo concluído. Hora da pausa.':'Pausa terminada. Pronto para o próximo pomo?',schedule:{at:new Date(r.endAt),allowWhileIdle:true}}]})}catch(e){}}

/* ---- sessão ---- */
function fcStart(kind,id,force){if(kind==='free'&&!force&&!id){const st=agState(Date.now());if(st.cur&&!st.cur.t.med){openSheet({type:'linkq',hab:st.cur.t.hab||null,tid:st.cur.t.id,pomo:isPomo(st.cur.t),title:st.cur.t.title});return}}
const f=FS(),title=kind==='task'?(taskOf(id)||{}).title:kind==='habit'?(habitOf(id)||{}).title:'Foco livre';
f.run={kind:kind,id:id||null,title:title||'Foco livre',phase:'focus',left:FOCUS_MS,endAt:Date.now()+FOCUS_MS,running:true};audioUnlock();ensurePerm();fcNotify(f.run);save();fcOpen();if(V.tab==='foco')render()}
function fcToggle(){const r=FS().run;if(!r)return;audioUnlock();if(r.running){r.left=Math.max(0,r.endAt-Date.now());r.running=false}else{r.endAt=Date.now()+r.left;r.running=true}fcNotify(r);save();fcUI()}
function fcSkip(){const r=FS().run;if(!r)return;r.phase='focus';r.left=FOCUS_MS;r.running=false;fcNotify(null);save();fcUI()}
function fcEnd(){FS().run=null;fcNotify(null);save();fcClose();updatePill();render()}
function fcComplete(){const f=FS(),r=f.run;if(!r)return;const late=Date.now()-r.endAt>2500;let nw=[];
if(r.phase==='focus'){f.pomos++;f.cycle=(f.cycle||0)+1;f.log.push({t:Date.now(),day:today(),kind:r.kind,id:r.id,title:runTitle(r)});nw=PRIZES.filter(z=>z.n<=f.pomos&&z.n>(f.seenN||0));f.seenN=f.pomos;r.phase=f.cycle%4===0?'long':'short';r.left=phMs(r.phase);r.running=!late;r.endAt=Date.now()+r.left}
else{r.phase='focus';r.left=FOCUS_MS;r.running=false}
if(!late)chime();fcNotify(r.running?r:null);save();fcUI();if(V.tab==='foco')render();else renderChrome();
if(r.phase!=='focus'&&nw.length===0&&!focusOpen)toast('Pomo concluído · '+f.pomos+' no total');
if(nw.length)setTimeout(()=>showPrize(nw[nw.length-1]),700)}
function showPrize(z){const tm=$('#ftime');if(tm&&focusOpen){const r=tm.getBoundingClientRect();ORIG={x:r.left+r.width/2,y:r.top+r.height/2}}openSheet({type:'prize',p:z})}
function fcTick(){const r=S.focus&&S.focus.run;if(r&&r.running&&Date.now()>=r.endAt)fcComplete();else fcUI()}

else el.animate([{clipPath:'circle(0px at '+ORIG.x+'px '+ORIG.y+'px)'},{clipPath:'circle('+R+'px at '+ORIG.x+'px '+ORIG.y+'px)'}],{duration:640,easing:'cubic-bezier(.2,.8,.2,1)'});

function agoraCardHTML(){const now=Date.now(),st=agState(now);let ttl,sub,small='Agora',mini='';
const hmsF=ms=>{const h=agHMS(ms);return (h[0]?h[0]+':':'')+pad(h[1])+':'+pad(h[2])};
const miniOf=(cs,idx)=>'<span class="agm">'+cs.map((c,i)=>'<i class="'+(c.k==='b'?'b':'')+'" style="flex:'+Math.max(1,Math.round((c.e-c.s)/60000))+' 1 0;--p:'+(now>=c.e?100:now<c.s?0:Math.round((now-c.s)/(c.e-c.s)*100))+'%"></i>').join('')+'</span>';
if(st.cur){const b=st.cur,cs=isPomo(b.t)?agCells(b):[{k:'f',s:b.s,e:b.e,n:1,of:1,one:true}],idx=Math.max(0,cs.findIndex(c=>c.s<=now&&now<c.e)),c=cs[idx];ttl=b.t.title;
 sub=(c.one?'faltam ':(c.k==='f'?'Foco '+c.n+' de '+c.of:'Pausa')+' · ')+hmsF(c.e-now)+' · bloco '+Math.floor((now-b.s)/(b.e-b.s)*100)+'%';mini=miniOf(cs,idx)}
else if(st.over){ttl=st.over.t.title;small='O horário terminou';sub='há '+stimMin(now-st.over.e)+' · toque para concluir ou estender';mini=miniOf([{k:'f',s:0,e:1}],0).replace('--p:0%','--p:100%')}
else if(st.next){ttl='Livre agora';sub='Próximo: '+st.next.t.title+' às '+agFmt(st.next.s)+' · em '+stimMin(st.next.s-now);mini=miniOf([{k:'f',s:now+1,e:now+2}],0)}
else{ttl='Seu dia está livre';sub='Crie blocos com horário para ver a bateria aqui';mini=miniOf([{k:'f',s:now+1,e:now+2}],0)}
return '<div class="card click rc agc2" id="agcard" data-a="agopen">'+mini+'<div class="cb"><small>'+esc(small)+'</small><div class="tt">'+esc(ttl)+'</div><div class="mt">'+esc(sub)+'</div></div><span class="agc2-go" aria-hidden="true">'+ic('chev',18)+'</span></div>'}
function agCardTick(){const e=document.getElementById('agcard');if(!e||V.tab!=='foco')return;const t=document.createElement('div');t.innerHTML=agoraCardHTML();const n=t.firstChild;if(n&&n.innerHTML!==e.innerHTML)e.innerHTML=n.innerHTML}
function fopts(q){q=(q||'').trim();const ok=s=>!q||match(q,s),f=FS(),k=t=>t.due||'9999-99-99',cnt=(id)=>f.log.filter(l=>l.id===id).length;let h=q?'':agoraCardHTML();

if(ts.length)h+='<div class="sec">Tarefas</div>'+ts.map(t=>{const p=projOf(t.projectId),ar=fol(tFolder(t)),n=cnt(t.id);return '<div class="row fopt" data-a="fstart" data-k="task" data-id="'+t.id+'"><div class="tx"><div class="tt">'+esc(t.title)+'</div><div class="mt">'+esc([isToday(t)?'Hoje':null,p?p.title:ar?ar.name:null,n?n+(n===1?' pomo':' pomos'):null].filter(Boolean).join(' · '))+'</div></div></div>'}).join('');

function focoView(){const f=FS(),pi=prizeInfo(),r=f.run;
